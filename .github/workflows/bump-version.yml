name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Guard selected branch and bump VERSION only
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          BUMP_MODE: ${{ inputs.mode }}
        run: python3 .github/scripts/bump.py "$BUMP_MODE" --sha "$EVENT_SHA" --ref "$EVENT_REF"

      - name: summary
        run: echo "### Source version bumped — run Build separately on the resulting branch commit." >> "$GITHUB_STEP_SUMMARY"
